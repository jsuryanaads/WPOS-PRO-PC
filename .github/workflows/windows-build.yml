name: WPOS PRO Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Build EXE
        run: python -m PyInstaller --clean --noconfirm --windowed --name "WPOS PRO" --paths . run.py

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "dist\WPOS PRO\WPOS PRO.exe"
          if (!(Test-Path $exe)) { throw "EXE tidak ditemukan: $exe" }
          Get-Item $exe | Format-List FullName,Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: WPOS-PRO-V1.0-Windows
          path: dist/WPOS PRO/
          if-no-files-found: error
          retention-days: 14
