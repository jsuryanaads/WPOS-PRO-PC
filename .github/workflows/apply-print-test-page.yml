name: Apply Print Test Page Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'chore: integrate Print Test page') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate page into MainWindow
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/ui/main_window.py')
          text = path.read_text(encoding='utf-8')

          import_line = 'from .print_test import print_test_page\n'
          anchor_import = 'from .master_data import category_page, unit_page, supplier_page, customer_page\n'
          if import_line not in text:
              if anchor_import not in text:
                  raise SystemExit('MainWindow import anchor not found')
              text = text.replace(anchor_import, anchor_import + import_line, 1)

          page_line = '            (print_test_page(), "Print Test"),\n'
          anchor_page = '            (self.printer_page(), "Printer"),\n'
          if page_line not in text:
              if anchor_page not in text:
                  raise SystemExit('MainWindow page anchor not found')
              text = text.replace(anchor_page, anchor_page + page_line, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ui/main_window.py
          if git diff --cached --quiet; then
            echo "Print Test page already integrated."
            exit 0
          fi
          git commit -m "chore: integrate Print Test page"
          git push origin HEAD:main
