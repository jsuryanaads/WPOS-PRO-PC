name: WPOS PRO Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Verify branding asset
        shell: pwsh
        run: |
          $logo = "assets\branding\wpos_logo.png"
          if (!(Test-Path $logo)) { throw "Logo tidak ditemukan: $logo" }

      - name: Generate Windows icon
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('assets/branding/wpos_logo.png').convert('RGBA').save('assets/branding/wpos_logo.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          if (!(Test-Path "assets\branding\wpos_logo.ico")) { throw "ICO tidak berhasil dibuat" }

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Build EXE with WPOS icon
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --windowed --icon "assets\branding\wpos_logo.ico" --name "WPOS PRO" --paths . --add-data "assets\branding\wpos_logo.png;assets\branding" run.py

      - name: Verify EXE, icon and branding
        shell: pwsh
        run: |
          $exe = "dist\WPOS PRO\WPOS PRO.exe"
          $logo = "dist\WPOS PRO\_internal\assets\branding\wpos_logo.png"
          if (!(Test-Path $exe)) { throw "WPOS PRO.exe tidak ditemukan" }
          if (!(Test-Path $logo)) { throw "Logo tidak ikut dipaketkan: $logo" }
          Get-Item $exe, $logo | Format-List FullName,Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = "installer\WPOS_PRO_V1.1.4_Setup.exe"
          if (!(Test-Path $setup)) { throw "Installer tidak ditemukan: $setup" }
          Get-Item $setup | Format-List FullName,Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WPOS-PRO-V1.1.4-Installer
          path: installer/WPOS_PRO_V1.1.4_Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish V1.1.4 release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create V1.1.4 --title "V1.1.4" --notes "WPOS PRO V1.1.4 — Branded Windows application icon" 2>$null
          if ($LASTEXITCODE -ne 0) { $LASTEXITCODE = 0 }
          gh release upload V1.1.4 installer/WPOS_PRO_V1.1.4_Setup.exe --clobber
