name: WPOS PRO Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Verify branding asset
        shell: pwsh
        run: |
          $logo = "assets\branding\wpos_logo.png"
          if (!(Test-Path $logo)) { throw "Logo tidak ditemukan: $logo" }

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --windowed --name "WPOS PRO" --paths . --add-data "assets\branding\wpos_logo.png;assets\branding" run.py

      - name: Verify EXE and branding
        shell: pwsh
        run: |
          $exe = "dist\WPOS PRO\WPOS PRO.exe"
          $logo = "dist\WPOS PRO\_internal\assets\branding\wpos_logo.png"
          if (!(Test-Path $exe)) { throw "WPOS PRO.exe tidak ditemukan" }
          if (!(Test-Path $logo)) { throw "Logo tidak ikut dipaketkan: $logo" }
          Get-Item $exe, $logo | Format-List FullName,Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = "installer\WPOS_PRO_V1.1.1_Setup.exe"
          if (!(Test-Path $setup)) { throw "Installer tidak ditemukan: $setup" }
          Get-Item $setup | Format-List FullName,Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WPOS-PRO-V1.1.1-Installer
          path: installer/WPOS_PRO_V1.1.1_Setup.exe
          if-no-files-found: error
          retention-days: 14
